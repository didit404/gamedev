<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Nusa - Final Boss Battle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lato:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: 'Lato', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #c79a3b;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(199, 154, 59, 0.5);
            position: relative;
        }

        h1 {
            text-align: center;
            font-family: 'Cinzel', serif;
            color: #f1c40f;
            margin-top: 0;
            text-shadow: 2px 2px 5px #000;
        }

        /* Health Bars */
        .battle-arena {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            align-items: flex-end;
        }

        .character-status {
            width: 40%;
        }

        .character-name {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .hp-bar-container {
            width: 100%;
            height: 20px;
            background: #333;
            border: 2px solid #555;
            border-radius: 10px;
            overflow: hidden;
        }

        .hp-bar {
            height: 100%;
            width: 100%;
            transition: width 0.3s ease;
        }

        #player-hp-fill { background: #2ecc71; }
        #boss-hp-fill { background: #e74c3c; }

        .boss-status { text-align: right; }

        /* Timer */
        #timer-container {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #e74c3c;
            margin: 15px 0;
            text-shadow: 1px 1px 10px rgba(231, 76, 60, 0.8);
        }

        /* Quiz Section */
        #quiz-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #c79a3b;
        }

        #question-text {
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: linear-gradient(to bottom, #2c3e50, #1a252f);
            color: #fff;
            border: 1px solid #c79a3b;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: linear-gradient(to bottom, #c79a3b, #a67b27);
            color: #000;
            font-weight: bold;
            transform: scale(1.02);
        }

        /* Overlays (Start/End screens) */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            z-index: 10;
        }

        #overlay h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: #f1c40f;
            margin-bottom: 10px;
        }

        #overlay p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
        }

        .action-btn {
            background: #f1c40f;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.5);
        }
        
        .action-btn:hover { background: #d4ac0d; }

        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>PUNCAK CHRONOS</h1>
        
        <div class="battle-arena">
            <div class="character-status">
                <div class="character-name">Pahlawan Waktu</div>
                <div class="hp-bar-container">
                    <div id="player-hp-fill" class="hp-bar"></div>
                </div>
            </div>
            
            <div class="character-status boss-status">
                <div class="character-name">Kala Corruptus</div>
                <div class="hp-bar-container">
                    <div id="boss-hp-fill" class="hp-bar"></div>
                </div>
            </div>
        </div>

        <div id="timer-container">10</div>

        <div id="quiz-container">
            <div id="question-text">Memuat pertanyaan sejarah...</div>
            <div class="options-grid" id="options-container">
                <!-- Tombol opsi akan dibuat lewat JavaScript -->
            </div>
        </div>

        <!-- Start/Win/Lose Overlay -->
        <div id="overlay">
            <h2 id="overlay-title">KALA CORRUPTUS MENANTI</h2>
            <p id="overlay-text">Bos terakhir mencoba menghapus ingatan bangsa!<br>Jawab pertanyaan sejarah dengan benar dalam 10 detik untuk mengalahkannya.</p>
            <button class="action-btn" id="overlay-btn" onclick="startGame()">Mulai Pertarungan</button>
        </div>
    </div>

    <script>
        // Database Pertanyaan Sejarah
        const questions = [
            {
                q: "Kerajaan Hindu tertua di Indonesia yang dibuktikan dengan penemuan Prasasti Yupa adalah...",
                options: ["Kerajaan Tarumanegara", "Kerajaan Kutai", "Kerajaan Majapahit", "Kerajaan Sriwijaya"],
                answer: 1 // Index jawaban benar (Kutai)
            },
            {
                q: "Peristiwa Sumpah Pemuda yang menjadi tonggak pergerakan nasional terjadi pada tanggal...",
                options: ["20 Mei 1908", "17 Agustus 1945", "28 Oktober 1928", "1 Juni 1945"],
                answer: 2
            },
            {
                q: "Siapakah Jenderal Besar yang memimpin perang gerilya mempertahankan kemerdekaan meski dalam keadaan sakit?",
                options: ["Jenderal Soedirman", "Jenderal A.H. Nasution", "Jenderal Ahmad Yani", "Pangeran Diponegoro"],
                answer: 0
            },
            {
                q: "Organisasi pergerakan nasional modern pertama di Indonesia yang berdiri tahun 1908 adalah...",
                options: ["Sarekat Islam", "Indische Partij", "Budi Utomo", "Muhammadiyah"],
                answer: 2
            },
            {
                q: "Naskah Proklamasi Kemerdekaan Indonesia diketik oleh...",
                options: ["Soekarno", "Sayuti Melik", "Sutan Sjahrir", "Mohammad Hatta"],
                answer: 1
            }
        ];

        let currentQuestionIndex = 0;
        let playerHP = 100;
        let bossHP = 100;
        let timeLeft = 10;
        let timerInterval;

        const bossDamage = 20; // 5 jawaban benar untuk menang
        const playerDamage = 34; // 3 kali salah/habis waktu kalah

        // Elemen UI
        const playerHpFill = document.getElementById('player-hp-fill');
        const bossHpFill = document.getElementById('boss-hp-fill');
        const timerDisplay = document.getElementById('timer-container');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayText = document.getElementById('overlay-text');
        const overlayBtn = document.getElementById('overlay-btn');
        const gameContainer = document.getElementById('game-container');

        function startGame() {
            playerHP = 100;
            bossHP = 100;
            currentQuestionIndex = 0;
            updateHP();
            overlay.style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                // Jika soal habis tapi bos belum mati, ulang soal (loop)
                currentQuestionIndex = 0; 
            }

            const currentQ = questions[currentQuestionIndex];
            questionText.innerText = currentQ.q;
            optionsContainer.innerHTML = '';

            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.innerText = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 10;
            timerDisplay.innerText = timeLeft;
            timerDisplay.style.color = "#e74c3c";

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleWrongAnswer("Waktu Habis!");
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex) {
            clearInterval(timerInterval);
            const currentQ = questions[currentQuestionIndex];

            if (selectedIndex === currentQ.answer) {
                handleCorrectAnswer();
            } else {
                handleWrongAnswer("Jawaban Salah!");
            }
        }

        function handleCorrectAnswer() {
            bossHP -= bossDamage;
            if(bossHP < 0) bossHP = 0;
            updateHP();
            
            // Efek visual bos kena damage
            gameContainer.classList.add('shake');
            setTimeout(() => gameContainer.classList.remove('shake'), 500);

            if (bossHP === 0) {
                endGame(true);
            } else {
                currentQuestionIndex++;
                setTimeout(loadQuestion, 1000);
            }
        }

        function handleWrongAnswer(reason) {
            playerHP -= playerDamage;
            if(playerHP < 0) playerHP = 0;
            updateHP();

            // Efek visual layar merah sebentar
            gameContainer.style.borderColor = "red";
            gameContainer.classList.add('shake');
            setTimeout(() => {
                gameContainer.style.borderColor = "#c79a3b";
                gameContainer.classList.remove('shake');
            }, 500);

            if (playerHP === 0) {
                endGame(false, reason);
            } else {
                currentQuestionIndex++;
                setTimeout(loadQuestion, 1000);
            }
        }

        function updateHP() {
            playerHpFill.style.width = playerHP + "%";
            bossHpFill.style.width = bossHP + "%";
        }

        function endGame(isWin, reason = "") {
            clearInterval(timerInterval);
            overlay.style.display = 'flex';
            
            if (isWin) {
                overlayTitle.innerText = "KEMENANGAN!";
                overlayTitle.style.color = "#2ecc71";
                overlayText.innerText = "Kamu berhasil mengalahkan Kala Corruptus dan menyelamatkan garis waktu sejarah Indonesia!";
                overlayBtn.innerText = "Selesaikan Petualangan";
                overlayBtn.onclick = () => alert("Terima kasih telah bermain Chrono Nusa!"); // Bisa diganti pindah halaman
            } else {
                overlayTitle.innerText = "WAKTU RUNTUH...";
                overlayTitle.style.color = "#e74c3c";
                overlayText.innerText = `${reason}\nIngatan bangsa telah terhapus oleh Kala Corruptus.`;
                overlayBtn.innerText = "Bangkit dan Coba Lagi";
                overlayBtn.onclick = startGame;
            }
        }
    </script>
</body>
</html>
